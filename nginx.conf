# TINYCADE - nginx \u9759\u6001\u670d\u52a1\u914d\u7f6e
# \u653e\u7f6e\u5728 sites-enabled/tinycade.conf \u540e\u91cd\u8f7d nginx

server {
    listen 80;
    server_name _;

    root /var/www/tinycade;
    index index.html;
    charset utf-8;

    # \u5b89\u5168\u5934\u90e8
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src '\''self'\''; script-src '\''self'\'' https://fonts.googleapis.com; style-src '\''self'\'' '\''unsafe-inline'\'' https://fonts.googleapis.com; font-src '\''self'\'' https://fonts.gstatic.com data:; img-src '\''self'\'' data:; connect-src '\''self'\''; object-src '\''none'\''; base-uri '\''self'\''; form-action '\''self'\''" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # HTML \u4e0d\u7f13\u5b58
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # \u5e26\u7248\u672c\u54c8\u5e0c\u7684\u9759\u6001\u8d44\u6e90\uff1a\u957f\u671f\u7f13\u5b58
    location ~* \.[a-f0-9]{8,}\.(js|css|woff2?|svg|png|jpe?g|gif|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    # \u5176\u4ed6\u9759\u6001\u8d44\u6e90\uff1a1 \u5c0f\u65f6
    location / {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ /index.html;
    }

    # \u7981\u6b62\u8bbf\u95ee\u9690\u85cf\u6587\u4ef6
    location ~ /\.(?!well-known) {
        deny all;
    }
}
